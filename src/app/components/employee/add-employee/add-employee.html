<div class="employee-page">

  <div class="employee-card">

    <div class="page-header">

      <div>
        <h2>Add Employee</h2>

        <p>
          Create an employee account and login credentials
        </p>
      </div>

      <a
        routerLink="/dashboard"
        class="back-link">

        Back to Dashboard

      </a>

    </div>

    <form
      #employeeForm="ngForm"
      (ngSubmit)="addEmployee()">

      <div class="form-group">

        <label>Employee Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="employee.name"
          placeholder="Enter employee name"
          required>

      </div>

      

      <!-- <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="employee.email"
          placeholder="Enter login email"
          required
          email>

      </div> -->

      <div class="form-group">

  <label>Capita Email</label>

  <input
    type="email"
    name="email"
    [(ngModel)]="employee.email"
    placeholder="firstname.lastname@capita.co.uk"
    required
    email
    pattern="[A-Za-z]+\.[A-Za-z]+@capita\.co\.uk">

  <small class="email-help">
    Example: swarali.lendghar@capita.co.uk
  </small>

</div>

      <div class="form-group">

        <label>Temporary Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="employee.password"
          placeholder="Create temporary password"
          required>

      </div>

      <div class="form-group">

        <label>Department</label>

        <select
          name="department"
          [(ngModel)]="employee.department"
          required>

          <option value="">
            Select Department
          </option>

          <option value="IT">
            IT
          </option>

          <option value="HR">
            HR
          </option>

          <option value="Finance">
            Finance
          </option>

          <option value="Operations">
            Operations
          </option>

        </select>

      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="
          employeeForm.invalid ||
          isSubmitting
        ">

        {{
          isSubmitting
            ? 'Adding Employee...'
            : 'Add Employee'
        }}

      </button>

    </form>

    @if (successMessage) {

      <p class="success-message">
        {{ successMessage }}
      </p>

    }

    @if (errorMessage) {

      <p class="error-message">
        {{ errorMessage }}
      </p>

    }

  </div>

</div>
